version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: workora_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./Backend
    container_name: workora_backend
    ports:
      - "3560:3560"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/workora
      - PORT=3560
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost
    depends_on:
      - mongodb

  frontend:
    build: ./Frontend
    container_name: workora_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
